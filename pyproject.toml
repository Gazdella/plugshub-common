[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "plugshub-common"
version = "0.4.5"
description = "Shared fleet helpers (SaaS Constitution Appendix A) — config, logging, errors, HTTP middleware, service auth, DB pool + tenant resolver, resilience, clients, messaging, validation, authorization, audit, feature flags, and canonical time/money. Byte-identical across every service."
requires-python = ">=3.9"
authors = [{ name = "Da-tene" }]
readme = "README.md"

# Core dependencies — kept light. Config (Article III) and validation (Article VI §5) are
# cross-cutting requirements, so pydantic ships in the core. Heavier backends are optional extras.
dependencies = [
    "pydantic>=2,<3",
    "pydantic-settings>=2,<3",
]

[project.optional-dependencies]
# HTTP edge + inter-service client (Articles IV/V/VIII): FastAPI/Starlette middleware + aiohttp.
http = ["fastapi>=0.100", "starlette>=0.27", "aiohttp>=3.8"]
# Shared async DB pool + tenant resolver (Article IX).
db = ["aiomysql>=0.1"]
# Redis-backed feature flags / kill switches (Article XXVI §4).
redis = ["redis>=4"]
# Reliable messaging backends (Article VIII §3) — the in-memory defaults need nothing; a shared
# processed-id / DLQ store in production commonly uses redis.
messaging = ["redis>=4"]
# Error tracking / observability SDK (Article IV §6) — lazy, only needed when a DSN is configured.
sentry = ["sentry-sdk>=1.40"]
# Everything, for a service that uses the full toolbox.
all = [
    "fastapi>=0.100",
    "starlette>=0.27",
    "aiohttp>=3.8",
    "aiomysql>=0.1",
    "redis>=4",
    "sentry-sdk>=1.40",
]
# Local development / CI gates (Article XVII §5).
#
# `httpx` is not optional despite the package never importing it: starlette's
# TestClient refuses to start without it, so `pytest` on a clean checkout failed
# at COLLECTION with "The starlette.testclient module requires the httpx
# package". It was in no metadata at all — the suite only ever ran where someone
# happened to have httpx installed for another reason.
dev = [
    "pytest>=7",
    "pytest-asyncio>=0.21",
    "pytest-cov>=4",
    "httpx>=0.24",
    # PINNED, not floated. `ruff format` output changes between minor releases, so
    # a range turns the format gate into a time bomb: CI reformats and fails on a
    # commit that touched nothing, and the failure looks like the author's fault.
    # These are the versions the rest of the fleet pins (terminal, ocpi, ocpp).
    "ruff==0.6.9",
    "mypy==1.11.2",
]

[project.urls]
Repository = "https://github.com/Gazdella/plugshub-common"

[tool.setuptools]
packages = ["plugshub_common"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
ignore = ["B008"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.9"
ignore_missing_imports = true
# Do not type-check INSTALLED packages. `python_version = "3.9"` makes mypy parse
# everything it follows as 3.9, and third-party code is not written to our floor —
# anyio uses `match`, so mypy died with a syntax error inside a dependency before
# reaching a single line of ours. With this, their imports resolve to Any
# (ignore_missing_imports above) and only this package is checked.
no_site_packages = true
warn_unused_ignores = false
